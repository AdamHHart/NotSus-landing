
services:
  - type: web
    name: notsus-web
    env: node
    buildCommand: npm install && node scripts/patch-gopd.js && npm rebuild bcrypt --build-from-source && npm run build:home && npm run check:home && npm run check:about && npm run check:routes && npm run check:cta && npm run check:dock
    startCommand: npm run migrate && npm start
    nodeVersion: 20.x
    envVars:
      - key: NODE_ENV
        value: production
      # The rebuilt home screen is the default. 'classic' puts the old page
      # back at '/'. See the '/' route in server.js.
      - key: HOME_PAGE
        value: replica
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: notsus-db
          property: connectionString
databases:
  - name: notsus-db
    ipAllowList: []
