
services:
  - type: web
    name: notsus-web
    env: node
    buildCommand: npm install && node scripts/patch-gopd.js && npm rebuild bcrypt --build-from-source && npm run build:home && npm run build:seo && npm run check:home && npm run check:about && npm run check:routes && npm run check:cta && npm run check:dock && npm run check:seo && npm run check:ratelimit
    startCommand: npm run migrate && npm start
    nodeVersion: 20.x
    # Deploys are manual, deliberately. Adam wants to choose when a change
    # reaches families, rather than have a push do it. Do not set autoDeploy
    # here: the dashboard governs it anyway, and a line here saying otherwise
    # only misleads whoever reads this next.
    envVars:
      - key: NODE_ENV
        value: production
      # The rebuilt home screen is the default. 'classic' puts the old page
      # back at '/'. See the '/' route in server.js.
      - key: HOME_PAGE
        value: replica
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: notsus-db
          property: connectionString
databases:
  - name: notsus-db
    ipAllowList: []
